name: Collect real-time snapshots

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch:         # adds a "Run workflow" button for manual tests

permissions:
  contents: write            # allows the job to push to the data branch

concurrency:
  group: collector           # never two runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install dependencies
        run: pip install -r requirements-collector.txt

      - name: Collect one snapshot
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: python -m src.collector --out-dir data-branch/snapshots

      - name: Commit and push snapshot
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "Nothing to commit"; exit 0; }
          for attempt in 1 2 3; do
            git pull --rebase origin data && git push origin data && exit 0
            sleep 5
          done
          echo "Push failed after 3 attempts"; exit 1